<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 184" width="470" height="184">
  <defs>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- soft white aura glow (best-effort) -->
  <circle cx="94" cy="92" r="52" fill="#ffffff" opacity="0.18" filter="url(#glow)"/>
  <!-- faint outer halo ring (always renders) -->
  <circle cx="94" cy="92" r="62" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.42"/>

  <!-- legibility shadow: offset dark copy, no blur dependency -->
  <g transform="translate(3,4)" opacity="0.30">
    <circle cx="94" cy="92" r="48" fill="none" stroke="#000000" stroke-width="14"/>
    <circle cx="94" cy="92" r="22" fill="#000000"/>
    <text x="170" y="125" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="102" letter-spacing="-2" fill="#000000">Aura</text>
  </g>

  <!-- white mark + wordmark -->
  <circle cx="94" cy="92" r="48" fill="none" stroke="#ffffff" stroke-width="14"/>
  <circle cx="94" cy="92" r="22" fill="#ffffff"/>
  <text x="170" y="125" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="102" letter-spacing="-2" fill="#ffffff">Aura</text>
</svg>