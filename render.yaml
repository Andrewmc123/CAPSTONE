# Render Blueprint for ABLN — a Dockerized Flask + React web service.
#
# Deploy:
#   Render Dashboard → New + → Blueprint → pick the CAPSTONE repo → Apply.
#
# Database: defaults to a self-contained SQLite file (DATABASE_URL below) so the
# app always boots with ZERO external setup. Demo data is (re)seeded on each
# fresh boot. Data is not persistent across redeploys — fine for a demo.
#
# To upgrade to a PERSISTENT database later (e.g. Neon — free, serverless):
#   1. set DATABASE_URL to the Neon Postgres connection string
#   2. change FLASK_ENV to "production"  (enables the abln_schema)
# No code changes needed — the app already supports both.

services:
  - type: web
    name: abln
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/docs
    autoDeploy: true
    envVars:
      - key: FLASK_APP
        value: app
      # "development" keeps SQLite-friendly behavior (no Postgres-only schema).
      # Switch to "production" only together with a Postgres DATABASE_URL.
      - key: FLASK_ENV
        value: development
      - key: SCHEMA
        value: abln_schema
      - key: SECRET_KEY
        generateValue: true
      # Self-contained SQLite so the deploy always boots. Replace with a Neon
      # Postgres URL (and set FLASK_ENV=production) for a persistent database.
      - key: DATABASE_URL
        value: sqlite:////var/www/prod.db
      - key: PYTHONUNBUFFERED
        value: "1"
      # Optional: add your own Tenor key for higher GIF rate limits
      # - key: TENOR_API_KEY
      #   sync: false
